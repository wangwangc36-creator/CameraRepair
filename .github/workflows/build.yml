name: Build CameraRepair APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and publish result
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          rc=$?
          mkdir -p dist
          rm -rf dist/b64
          rm -f dist/CameraRepair-v4.0.0.apk dist/build-failure.txt dist/CameraRepair-v4.0.0.sha256
          if [ "$rc" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/CameraRepair-v4.0.0.apk
            sha256sum dist/CameraRepair-v4.0.0.apk | awk '{print $1}' > dist/CameraRepair-v4.0.0.sha256
            mkdir -p dist/b64
            base64 -w 0 dist/CameraRepair-v4.0.0.apk | split -b 3000 -d -a 3 - dist/b64/part-
          else
            cp build.log dist/build-failure.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Publish CameraRepair v4 build chunks [skip ci]" || true
          git push
          exit "$rc"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CameraRepair-v4.0.0
          path: dist/CameraRepair-v4.0.0.apk
          if-no-files-found: error
